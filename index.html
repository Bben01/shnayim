<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shnayim Mikra</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shnayim">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preconnect" href="https://www.sefaria.org">
    <link rel="dns-prefetch" href="https://www.sefaria.org">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            font-family: "SBL Hebrew", "Ezra SIL", "Times New Roman", serif;
            color: #1a1a1a;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        #app-container {
            box-sizing: border-box;
            margin: 0 auto;
            max-width: 650px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Original Nav Buttons --- */
        #nav {
            padding: 8px 15px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
        }

        #aliyah-title {
            font-size: 19px;
            font-weight: bold;
            color: #333;
        }

        #parsha-progress {
            min-height: 1.3em;
            font-family: sans-serif;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .header-settings {
            justify-self: start;
        }

        #navigation-arrows {
            justify-self: end;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: none;
            cursor: pointer;
            padding: 4px 12px;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* Force active look */
            opacity: 1 !important;
            color: #333 !important;
            transition: background-color 100ms ease, border-color 100ms ease;
        }

        button:hover {
            background: #eee;
        }

        button:active {
            background: #e4e6e7;
        }

        button:focus-visible {
            outline: 2px solid #77aab5;
            outline-offset: 2px;
        }

        /* Anti-Grey browser override */
        button:disabled {
            opacity: 1 !important;
            background: #f8f9fa !important;
            cursor: pointer;
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: #555;
        }

        .settings-control {
            position: relative;
            display: flex;
        }

        #settings-button {
            width: 36px;
            height: 32px;
            padding: 5px;
        }

        #settings-button .icon {
            width: 18px;
            height: 18px;
        }

        #settings-menu {
            position: absolute;
            top: calc(100% + 7px);
            right: 0;
            z-index: 300;
            min-width: 190px;
            max-width: calc(100vw - 16px);
            box-sizing: border-box;
            padding: 6px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        #settings-menu[hidden] {
            display: none;
        }

        #gemara-toggle {
            width: 100%;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 10px;
            border: 0;
            background: transparent;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: normal;
            white-space: nowrap;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 7px 10px;
            border-bottom: 1px solid #eee;
            font-family: sans-serif;
            font-size: 13px;
            white-space: nowrap;
        }

        .settings-font-buttons {
            display: flex;
            direction: ltr;
            gap: 4px;
        }

        .settings-font-buttons button {
            min-width: 32px;
            height: 28px;
            padding: 2px 7px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        #gemara-check {
            color: #126274;
            font-weight: bold;
        }

        /* --- Content Area --- */
        #main-div {
            padding: 15px 20px;
            text-align: justify;
            contain: content;
        }

        .perekTitle {
            font-weight: bold;
            font-size: 0.8em;
            text-align: center;
            color: #888;
            margin: 25px 0 15px 0;
            display: block;
            width: 100%;
        }

        .verse-sequence {
            display: inline;
        }

        .hebrew-text {
            color: #000;
            margin: 0 2px;
        }

        .targum-text {
            color: #004e5f;
            font-size: 0.94em;
            margin: 0 4px;
        }

        .parsha-break {
            font-weight: bold;
            display: inline;
        }

        .petuhah-marker::after {
            content: "";
            display: block;
            margin-bottom: 0.5em;
        }

        .setumah-marker {
            margin-right: 1.5em;
            margin-left: 0.5em;
        }

        .possuk-number {
            font-size: 0.65em;
            padding: 1px 5px;
            margin: 0 4px 0 6px;
            border: 1px solid #ddd;
            border-radius: 3px;
            color: #999;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            font-family: sans-serif;
            background: #fff;
            line-height: 1.2;
            vertical-align: middle;
        }

        .bookmark-active {
            background-color: #fff9c4 !important;
            border-color: #fbc02d !important;
            color: #000 !important;
        }

        button.gemara-trigger {
            display: none;
            min-width: 26px;
            min-height: 22px;
            padding: 1px 4px;
            margin: 0 1px 0 3px;
            border: 0;
            background: transparent;
            box-shadow: none;
            color: #547882 !important;
            font-family: inherit;
            font-size: 0.5em;
            line-height: 1.2;
            vertical-align: middle;
        }

        body.gemara-enabled button.gemara-trigger {
            display: inline-flex;
        }

        button.gemara-trigger:hover,
        button.gemara-trigger:focus-visible,
        button.gemara-trigger.gemara-open {
            background: #eaf3f5;
            color: #004e5f !important;
        }

        button.gemara-trigger:active {
            background: #dcebed;
        }

        button.gemara-trigger.gemara-unavailable {
            display: none !important;
        }

        #gemara-panel {
            position: fixed;
            z-index: 1000;
            width: min(340px, calc(100vw - 24px));
            max-height: min(520px, calc(100vh - 100px));
            overflow: auto;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #d9e2e4;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            font-family: "SBL Hebrew", "Ezra SIL", "Times New Roman", serif;
        }

        #gemara-panel[hidden] {
            display: none !important;
        }

        .gemara-panel-header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: #fff;
            border-bottom: 1px solid #edf0f1;
        }

        #gemara-panel-title {
            margin: 0;
            font-size: 16px;
            line-height: 1.3;
        }

        #gemara-close {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            font-size: 22px;
        }

        #gemara-links {
            margin: 0;
            padding: 5px 0;
            list-style: none;
        }

        .gemara-source-link {
            display: block;
            padding: 10px 14px;
            color: #123f49;
            text-decoration: none;
            border-bottom: 1px solid #f1f3f4;
        }

        .gemara-source-link:hover,
        .gemara-source-link:focus-visible {
            background: #f3f8f9;
        }

        .gemara-source-hebrew {
            display: block;
            font-size: 16px;
            font-weight: 600;
        }

        .gemara-empty {
            margin: 0;
            padding: 22px 16px;
            color: #68777b;
            font-family: sans-serif;
            font-size: 13px;
            text-align: center;
        }

        #gemara-drag-handle {
            display: none;
        }

        @media (max-width: 700px) {
            button.gemara-trigger {
                font-size: 0.55em;
            }

            #gemara-panel {
                top: auto !important;
                right: 0 !important;
                bottom: 0;
                left: 0 !important;
                width: 100%;
                height: min(190px, 70vh);
                max-height: 70vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                padding-bottom: env(safe-area-inset-bottom);
                border-width: 1px 0 0;
                border-radius: 18px 18px 0 0;
                box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.12);
            }

            #gemara-drag-handle {
                flex: 0 0 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 0;
                background: transparent;
                touch-action: none;
                cursor: ns-resize;
            }

            #gemara-drag-handle::after {
                content: "";
                width: 38px;
                height: 4px;
                border-radius: 2px;
                background: #c8d0d2;
            }

            .gemara-panel-header {
                flex: 0 0 auto;
                padding: 8px 14px 11px;
            }

            .gemara-source-link {
                min-height: 56px;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                padding: 10px 18px;
            }

            #gemara-panel-content {
                flex: 1 1 auto;
                min-height: 0;
                max-height: none;
                overflow-y: auto;
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
            }

            #gemara-links {
                padding: 0;
            }

            body.gemara-panel-open #footer-nav {
                padding-bottom: calc(var(--gemara-drawer-height, 190px) + 60px + env(safe-area-inset-bottom));
            }
        }

        @media (min-width: 980px) {
            body.gemara-panel-open #app-container {
                transform: translateX(148px);
            }

            #gemara-panel {
                top: 62px !important;
                right: auto !important;
                bottom: auto;
                left: calc(50% - 473px) !important;
                width: 280px;
                max-height: calc(100vh - 78px);
            }
        }

        @media (min-width: 1200px) {
            body.gemara-panel-open #app-container {
                transform: translateX(168px);
            }

            #gemara-panel {
                left: calc(50% - 493px) !important;
                width: 320px;
            }
        }

        /* --- Footer --- */
        #footer-nav {
            padding: 30px 20px 60px;
            text-align: center;
        }

        .footer-next-btn {
            background-color: #1a1a1a;
            color: white !important;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            display: block;
        }

        .footer-next-btn:hover {
            background-color: #1a1a1a !important;
            color: white !important;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div id="app-container">
        <div id="nav">
            <div class="header-settings">
                <div class="settings-control">
                    <button id="settings-button" type="button" aria-expanded="false" aria-controls="settings-menu" aria-label="הגדרות" onclick="toggleSettingsMenu(event)">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94L14.4 2.81a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41L9.24 5.35c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.72 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.31-.08.64-.08.94s.03.63.08.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.31.59.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7.1 7.1 0 0 0 1.62-.94l2.39.96c.22.09.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z" />
                        </svg>
                    </button>
                    <div id="settings-menu" hidden>
                        <div class="settings-row">
                            <span>גודל טקסט</span>
                            <div class="settings-font-buttons">
                                <button type="button" aria-label="הקטן טקסט" onclick="adjustFont(-2)">A−</button>
                                <button type="button" aria-label="הגדל טקסט" onclick="adjustFont(2)">A+</button>
                            </div>
                        </div>
                        <button id="gemara-toggle" type="button" aria-pressed="false" onclick="toggleGemara(event)">
                            <span>מקורות בבבלי</span><span id="gemara-check" hidden>✓</span>
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <div id="aliyah-title"></div>
                <div id="parsha-progress" aria-live="polite"></div>
            </div>

            <div id="navigation-arrows">
                <button id="btn-prev" onclick="changeAliyah(-1, event)">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z" />
                    </svg>
                </button>
                <button id="btn-next" onclick="changeAliyah(1, event)">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="main-div">
            <div id="verses-container"></div>
        </div>

        <div id="footer-nav" class="hidden">
            <button id="footer-next-btn" class="footer-next-btn" onclick="handleFooterClick(event)"></button>
        </div>
    </div>

    <section id="gemara-panel" role="dialog" aria-labelledby="gemara-panel-title" hidden>
        <div id="gemara-drag-handle" role="separator" aria-orientation="horizontal" aria-label="שנה את גובה החלונית"></div>
        <header class="gemara-panel-header">
            <h2 id="gemara-panel-title">מקורות בתלמוד הבבלי</h2>
            <button id="gemara-close" type="button" aria-label="סגור">×</button>
        </header>
        <div id="gemara-panel-content"></div>
    </section>

    <script>
        const API_BASE = "https://www.sefaria.org/api";
        const HEB_NUMBERS = ["א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט", "י", "יא", "יב", "יג", "יד", "טו", "טז", "יז", "יח", "יט", "כ", "כא", "כב", "כג", "כד", "כה", "כו", "כז", "כח", "כט", "ל", "לא", "לב", "לג", "לד", "לה", "לו", "לז", "לח", "לט", "מ", "מא", "מב", "מג", "מד", "מה", "מו", "מז", "מח", "מט", "נ", "נא", "נב", "נג", "נד", "נה", "נו", "נז", "נח", "נט", "ס", "סא", "סב", "סג", "סד", "סה", "סו", "סז", "סח", "סט", "ע", "עא", "עב", "עג", "עד", "עה", "עו", "עז", "עח", "עט", "פ", "פא", "פב", "פג", "פד", "פה", "פו", "פז", "פח", "פט", "צ", "צא", "צב", "צג", "צד", "צה", "צו", "צז", "צח", "צט", "ק"];
        const ALIYAH_NAMES = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שביעי"];
        const STORAGE_KEY = 'shnayim_bookmark_v2';
        const STATE_KEY = 'shnayim_state_v1';
        const CACHE_PREFIX = 'shnayim_cache_';
        const GEMARA_CACHE_PREFIX = 'shnayim_gemara_cache_';
        const GEMARA_ENABLED_KEY = 'shnayim_gemara_enabled_v1';
        const WEEKLY_BOUNDARY_VERSION = 3;

        const state = {
            parshaTitle: "",
            aliyotRefs: [],
            currentAliyahIndex: 0,
            fontSize: 24,
            bookmarkId: localStorage.getItem(STORAGE_KEY),
            bookmarkPosition: null,
            bookmarkAutoFocus: false,
            gemaraEnabled: localStorage.getItem(GEMARA_ENABLED_KEY) === 'true',
            readingPosition: null,
            verseCounts: {}
        };

        const inFlightRequests = new Map();
        const inFlightGemaraRequests = new Map();
        const gemaraMemoryCache = new Map();
        let prefetchScheduled = false;
        let loadSequence = 0;
        let scrollUpdateTimer = null;
        let saveTimer = null;
        let lastGemaraTrigger = null;
        let gemaraDrawerDrag = null;
        let gemaraDrawerHeight = null;
        const PREFETCH_BATCH_SIZE = 2;

        function getNextSaturday() {
            const d = new Date();
            const day = d.getDay();
            const diff = 6 - day + (day === 6 ? 7 : 0);
            const nextSaturday = new Date(d);
            // The application is not opened during Shabbat, so the next visit on
            // Saturday is the correct point to start the new weekly parasha.
            nextSaturday.setHours(0, 0, 0, 0);
            nextSaturday.setDate(d.getDate() + diff);
            return nextSaturday.getTime();
        }

        const PersistentCache = {
            get: (key) => {
                try {
                    const params = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
                    if (Date.now() > (params.expiration || 0)) return null;
                    const item = localStorage.getItem(CACHE_PREFIX + key);
                    return item ? JSON.parse(item) : null;
                } catch (e) { return null; }
            },
            set: (key, data) => {
                try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(data)); } catch (e) { }
            },
            clearAll: () => {
                Object.keys(localStorage).forEach(k => {
                    if (k.startsWith(CACHE_PREFIX)) localStorage.removeItem(k);
                });
            }
        };

        const GemaraCache = {
            get: (aliyahRef) => {
                if (gemaraMemoryCache.has(aliyahRef)) return gemaraMemoryCache.get(aliyahRef);
                try {
                    const params = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
                    if (Date.now() > (params.expiration || 0)) return null;
                    const item = localStorage.getItem(GEMARA_CACHE_PREFIX + aliyahRef);
                    if (!item) return null;
                    const data = JSON.parse(item);
                    gemaraMemoryCache.set(aliyahRef, data);
                    return data;
                } catch (e) { return null; }
            },
            set: (aliyahRef, data) => {
                gemaraMemoryCache.set(aliyahRef, data);
                try { localStorage.setItem(GEMARA_CACHE_PREFIX + aliyahRef, JSON.stringify(data)); } catch (e) { }
            },
            clearAll: () => {
                gemaraMemoryCache.clear();
                Object.keys(localStorage).forEach(k => {
                    if (k.startsWith(GEMARA_CACHE_PREFIX)) localStorage.removeItem(k);
                });
            }
        };

        function checkExpiration() {
            try {
                const storedState = localStorage.getItem(STATE_KEY);
                if (storedState) {
                    const data = JSON.parse(storedState);
                    if (data.weeklyBoundaryVersion !== WEEKLY_BOUNDARY_VERSION || Date.now() >= data.expiration) {
                        localStorage.removeItem(STATE_KEY);
                        localStorage.removeItem(STORAGE_KEY);
                        state.bookmarkId = null;
                        PersistentCache.clearAll();
                        GemaraCache.clearAll();
                        return null;
                    }
                    return data;
                }
            } catch (e) {
                PersistentCache.clearAll();
                GemaraCache.clearAll();
            }
            return null;
        }

        function saveState() {
            const existing = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
            const data = {
                parshaTitle: state.parshaTitle,
                aliyotRefs: state.aliyotRefs,
                currentAliyahIndex: state.currentAliyahIndex,
                fontSize: state.fontSize,
                bookmarkPosition: state.bookmarkPosition,
                bookmarkAutoFocus: state.bookmarkAutoFocus,
                verseCounts: state.verseCounts,
                weeklyBoundaryVersion: WEEKLY_BOUNDARY_VERSION,
                expiration: existing.expiration || getNextSaturday()
            };
            localStorage.setItem(STATE_KEY, JSON.stringify(data));
        }

        function scheduleSave() {
            if (saveTimer) return;
            saveTimer = setTimeout(() => {
                saveTimer = null;
                saveState();
            }, 500);
        }

        function flushSave() {
            if (saveTimer) {
                clearTimeout(saveTimer);
                saveTimer = null;
                saveState();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            }

            applyGemaraPreference();

            const savedData = checkExpiration();
            if (savedData) {
                state.parshaTitle = savedData.parshaTitle;
                state.aliyotRefs = savedData.aliyotRefs;
                state.currentAliyahIndex = savedData.currentAliyahIndex;
                state.fontSize = savedData.fontSize || 24;
                state.bookmarkPosition = savedData.bookmarkPosition || null;
                state.bookmarkAutoFocus = savedData.bookmarkAutoFocus ??
                    (savedData.currentAliyahIndex === savedData.bookmarkPosition?.aliyahIndex);
                state.verseCounts = savedData.verseCounts || {};
                if (state.bookmarkAutoFocus && state.bookmarkId && Number.isInteger(state.bookmarkPosition?.aliyahIndex) &&
                    state.bookmarkPosition.aliyahIndex >= 0 && state.bookmarkPosition.aliyahIndex < state.aliyotRefs.length) {
                    state.currentAliyahIndex = state.bookmarkPosition.aliyahIndex;
                }
                document.getElementById('main-div').style.fontSize = state.fontSize + "px";
                loadAliyah(state.currentAliyahIndex);
                schedulePrefetch();
            } else {
                document.getElementById('main-div').style.fontSize = state.fontSize + "px";
                await loadCalendar(new Date());
            }

            document.getElementById('verses-container').addEventListener('click', (e) => {
                const gemaraTrigger = e.target.closest('.gemara-trigger');
                if (gemaraTrigger) {
                    e.preventDefault();
                    e.stopPropagation();
                    openGemaraForTrigger(gemaraTrigger);
                    return;
                }
                if (e.target.classList.contains('possuk-number')) {
                    const id = e.target.getAttribute('data-id');
                    if (state.bookmarkId === id) {
                        state.bookmarkId = null;
                        state.bookmarkPosition = null;
                        state.bookmarkAutoFocus = false;
                        localStorage.removeItem(STORAGE_KEY);
                    } else {
                        state.bookmarkId = id;
                        state.bookmarkPosition = {
                            aliyahIndex: Number(e.target.dataset.aliyahIndex),
                            verseIndex: Number(e.target.dataset.verseIndex)
                        };
                        state.bookmarkAutoFocus = true;
                        state.readingPosition = state.bookmarkPosition;
                        localStorage.setItem(STORAGE_KEY, id);
                    }
                    renderBookmarkStyles();
                    saveState();
                    updateProgressEstimate();
                }
            });

            const dragHandle = document.getElementById('gemara-drag-handle');
            dragHandle.addEventListener('pointerdown', startGemaraDrawerResize);
            dragHandle.addEventListener('pointermove', resizeGemaraDrawer);
            dragHandle.addEventListener('pointerup', stopGemaraDrawerResize);
            dragHandle.addEventListener('pointercancel', stopGemaraDrawerResize);
            document.getElementById('gemara-close').addEventListener('click', () => closeGemaraPanel());
            document.addEventListener('click', (e) => {
                const panel = document.getElementById('gemara-panel');
                if (!panel.hidden && !isMobileGemaraLayout() && !panel.contains(e.target) &&
                    !e.target.closest('.gemara-trigger')) closeGemaraPanel(false);
                if (!e.target.closest('.settings-control')) closeSettingsMenu();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeGemaraPanel();
            });

            window.addEventListener('scroll', scheduleReadingPositionUpdate, { passive: true });
            window.addEventListener('resize', constrainGemaraDrawer);
            window.addEventListener('pagehide', flushSave);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) flushSave();
                else schedulePrefetch();
            });
        });

        function renderBookmarkStyles() {
            const container = document.getElementById('verses-container');
            container.querySelectorAll('.possuk-number').forEach(btn => {
                btn.classList.toggle('bookmark-active', btn.getAttribute('data-id') === state.bookmarkId);
            });
        }

        function getLocalDateStr(d) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        async function loadCalendar(date) {
            try {
                // The calendar API returns the parasha read on Shabbat for the whole
                // week, including Saturday. The new weekly parasha only starts on
                // Sunday, so on Saturday we must query the following day.
                if (date.getDay() === 6) {
                    date = new Date(date);
                    date.setDate(date.getDate() + 1);
                }
                const dateStr = getLocalDateStr(date);
                const res = await fetch(`${API_BASE}/calendars?diaspora=0&year=${dateStr.split('-')[0]}&month=${dateStr.split('-')[1]}&day=${dateStr.split('-')[2]}`);
                const data = await res.json();
                const parshaItem = data.calendar_items.find(item => item.title.en === "Parashat Hashavua");
                if (!parshaItem) return;

                state.parshaTitle = parshaItem.displayValue.he;
                state.aliyotRefs = parshaItem.extraDetails.aliyot.slice(0, 7);
                state.verseCounts = {};
                state.bookmarkPosition = null;
                state.bookmarkAutoFocus = false;
                state.readingPosition = null;
                state.bookmarkId = null;
                localStorage.removeItem(STORAGE_KEY);
                GemaraCache.clearAll();
                saveState();
                loadAliyah(0);
                schedulePrefetch();
            } catch (err) { console.error(err); }
        }

        async function loadAliyah(index) {
            const sequence = ++loadSequence;
            closeGemaraPanel(false);
            state.currentAliyahIndex = index;
            state.readingPosition = null;
            scheduleSave();
            const ref = state.aliyotRefs[index];
            updateUI();

            const cached = PersistentCache.get(ref);
            if (cached) {
                recordVerseCount(ref, cached.length);
                renderAliyah(cached);
                schedulePrefetch();
                return;
            }

            try {
                const data = await fetchAliyahData(ref);
                if (data) {
                    PersistentCache.set(ref, data);
                    recordVerseCount(ref, data.length);
                    if (sequence === loadSequence) renderAliyah(data);
                }
            } catch (err) { console.error(err); }
        }

        function schedulePrefetch() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (prefetchScheduled || document.hidden || connection?.saveData || connection?.effectiveType === '2g') return;
            prefetchScheduled = true;
            const run = () => {
                prefetchScheduled = false;
                prefetchNextBatch();
            };
            if ('requestIdleCallback' in window) window.requestIdleCallback(run, { timeout: 3000 });
            else setTimeout(run, 1500);
        }

        async function prefetchNextBatch() {
            let fetched = 0;
            for (let i = state.currentAliyahIndex + 1; i < state.aliyotRefs.length; i++) {
                if (document.hidden) return;
                const ref = state.aliyotRefs[i];
                if (!PersistentCache.get(ref)) {
                    try {
                        const data = await fetchAliyahData(ref);
                        if (data) {
                            PersistentCache.set(ref, data);
                            recordVerseCount(ref, data.length);
                        }
                    } catch (e) { }
                    fetched++;
                }
                if (fetched >= PREFETCH_BATCH_SIZE) {
                    schedulePrefetch();
                    return;
                }
            }
        }

        async function fetchAliyahData(ref) {
            if (inFlightRequests.has(ref)) return inFlightRequests.get(ref);
            const request = (async () => {
                const [cRes, oRes] = await Promise.all([
                    fetch(`${API_BASE}/v3/texts/${encodeURIComponent(ref)}?return_format=strip_only_footnotes`),
                    fetch(`${API_BASE}/v3/texts/${encodeURIComponent('Onkelos ' + ref)}?return_format=text_only`)
                ]);
                if (!cRes.ok || !oRes.ok) return null;
                const [cJson, oJson] = await Promise.all([cRes.json(), oRes.json()]);
                return (cJson.error || oJson.error) ? null : processData(cJson, oJson);
            })();
            inFlightRequests.set(ref, request);
            try {
                return await request;
            } finally {
                inFlightRequests.delete(ref);
            }
        }

        function recordVerseCount(ref, count) {
            if (state.verseCounts[ref] === count) return;
            state.verseCounts[ref] = count;
            scheduleSave();
            updateProgressEstimate();
        }

        function cleanSefariaHtml(html) {
            if (!html) return "";
            return html
                .replace(/&nbsp;/g, ' ')
                .replace(/<br\s*\/?>/gi, ' ')
                .replace(/\{פ\}/g, '')
                .replace(/\{ס\}/g, '')
                .trim();
        }

        function processData(cJson, oJson) {
            const getH = (j) => {
                if (!j || !j.versions) return [];
                let v = j.versions.find(v => v.language === 'he' && v.isPrimary) || j.versions.find(v => v.language === 'he');
                return v ? v.text : [];
            };
            const cT = getH(cJson);
            const oT = getH(oJson);
            let res = [];
            let isMulti = Array.isArray(cT[0]);

            if (isMulti) {
                let sP = parseInt(cJson.sections[0]);
                cT.forEach((chap, cIdx) => {
                    chap.forEach((vT, vIdx) => {
                        let vN = (cIdx === 0) ? (parseInt(cJson.sections[1]) + vIdx) : (1 + vIdx);
                        let p = sP + cIdx;
                        res.push({ p, n: vN, r: `${cJson.indexTitle} ${p}:${vN}`, h: vT, o: (oT[cIdx] ? oT[cIdx][vIdx] : ""), newP: (vIdx === 0 && (cIdx > 0 || vN === 1)) });
                    });
                });
            } else {
                let sP = parseInt(cJson.sections[0]);
                let sV = parseInt(cJson.sections[1]);
                cT.forEach((vT, vIdx) => {
                    let vN = sV + vIdx;
                    res.push({ p: sP, n: vN, r: `${cJson.indexTitle} ${sP}:${vN}`, h: vT, o: (oT[vIdx] || ""), newP: (vIdx === 0 && sV === 1) });
                });
            }
            return res;
        }

        function renderAliyah(data) {
            const container = document.getElementById('verses-container');
            state.readingPosition = null;
            if (state.bookmarkAutoFocus && state.bookmarkId && state.bookmarkPosition?.aliyahIndex === state.currentAliyahIndex) {
                state.readingPosition = state.bookmarkPosition;
            }
            let htmlChunks = [];
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                if (row.newP) {
                    htmlChunks.push(`<div class="perekTitle">פרק ${getHNum(row.p)}</div>`);
                }
                const id = `${state.parshaTitle}-${row.p}-${row.n}`;
                const bCls = state.bookmarkId === id ? 'bookmark-active' : '';
                const displayH = cleanSefariaHtml(row.h);
                const displayO = cleanSefariaHtml(row.o);
                const bookTitle = state.aliyotRefs[state.currentAliyahIndex].replace(/\s+\d.*$/, '');
                const encodedVerseRef = encodeURIComponent(row.r || `${bookTitle} ${row.p}:${row.n}`);
                const verseLabel = `פרק ${getHNum(row.p)}, פסוק ${getHNum(row.n)}`;
                htmlChunks.push(`<span class="verse-sequence">` +
                    `<span class="possuk-number ${bCls}" data-id="${id}" data-aliyah-index="${state.currentAliyahIndex}" data-verse-index="${i}" data-verse-ref="${encodedVerseRef}" data-verse-label="${verseLabel}">${getHNum(row.n)}</span>` +
                    `<button type="button" class="gemara-trigger gemara-unavailable" data-verse-ref="${encodedVerseRef}" data-verse-label="${verseLabel}" aria-label="מקורות בתלמוד הבבלי, ${verseLabel}" aria-expanded="false">גמ׳</button>` +
                    `<span class="hebrew-text">${displayH}</span>` +
                    `<span class="hebrew-text">${displayH}</span>` +
                    `<span class="targum-text">${displayO}</span>` +
                    (row.h.includes("{פ}") ? `<span class="parsha-break petuhah-marker">פ</span>` : "") +
                    (row.h.includes("{ס}") ? `<span class="parsha-break setumah-marker">ס</span>` : "") +
                    ` ` +
                    `</span>`);
            }
            container.innerHTML = htmlChunks.join('');
            const activeMark = document.querySelector('.bookmark-active');
            if (activeMark && state.bookmarkAutoFocus) activeMark.scrollIntoView({ behavior: 'auto', block: 'center' });
            else window.scrollTo(0, 0);
            updateProgressEstimate();
            scheduleReadingPositionUpdate();
            if (state.gemaraEnabled) prepareGemaraForCurrentAliyah();
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function getGemaraLinksForAliyah(aliyahRef) {
            const cached = GemaraCache.get(aliyahRef);
            if (cached) return cached;
            if (inFlightGemaraRequests.has(aliyahRef)) return inFlightGemaraRequests.get(aliyahRef);

            const request = (async () => {
                const response = await fetch(`${API_BASE}/links/${encodeURIComponent(aliyahRef)}?category=Talmud&with_text=0`);
                if (!response.ok) throw new Error(`Sefaria links request failed: ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Unexpected Sefaria links response');

                const grouped = {};
                const seen = new Map();
                for (const link of data) {
                    const indexTitle = link.index_title || '';
                    if (link.category !== 'Talmud' || /^Jerusalem Talmud\b/i.test(indexTitle)) continue;
                    const sourceRef = link.sourceRef || link.ref;
                    if (!sourceRef) continue;
                    const anchors = Array.isArray(link.anchorRefExpanded) && link.anchorRefExpanded.length
                        ? link.anchorRefExpanded
                        : [link.anchorRef];
                    for (const anchorRef of anchors) {
                        if (!anchorRef) continue;
                        if (!seen.has(anchorRef)) seen.set(anchorRef, new Set());
                        if (seen.get(anchorRef).has(sourceRef)) continue;
                        seen.get(anchorRef).add(sourceRef);
                        if (!grouped[anchorRef]) grouped[anchorRef] = [];
                        grouped[anchorRef].push({
                            ref: sourceRef,
                            heRef: link.sourceHeRef || link.heRef || '',
                            tractateHe: link.collectiveTitle?.he || link.heTitle || ''
                        });
                    }
                }
                Object.values(grouped).forEach(links => links.sort((a, b) => a.ref.localeCompare(b.ref, 'en', { numeric: true })));
                GemaraCache.set(aliyahRef, grouped);
                return grouped;
            })();

            inFlightGemaraRequests.set(aliyahRef, request);
            try {
                return await request;
            } finally {
                inFlightGemaraRequests.delete(aliyahRef);
            }
        }

        async function prepareGemaraForCurrentAliyah() {
            if (!state.gemaraEnabled || !state.aliyotRefs.length) return;
            const aliyahRef = state.aliyotRefs[state.currentAliyahIndex];
            try {
                const grouped = await getGemaraLinksForAliyah(aliyahRef);
                if (aliyahRef === state.aliyotRefs[state.currentAliyahIndex]) applyGemaraAvailability(grouped);
            } catch (e) {
                console.error(e);
            }
        }

        function applyGemaraAvailability(grouped) {
            document.querySelectorAll('.gemara-trigger').forEach(trigger => {
                const verseRef = decodeURIComponent(trigger.dataset.verseRef);
                const count = grouped[verseRef]?.length || 0;
                trigger.classList.toggle('gemara-unavailable', count === 0);
                if (count) trigger.setAttribute('aria-label', `${trigger.dataset.verseLabel}, ${count} מקורות בתלמוד הבבלי`);
            });
        }

        async function openGemaraForTrigger(trigger) {
            if (!state.gemaraEnabled || !trigger.dataset.verseRef) return;
            const aliyahRef = state.aliyotRefs[state.currentAliyahIndex];
            const verseRef = decodeURIComponent(trigger.dataset.verseRef);
            const panel = document.getElementById('gemara-panel');
            if (!panel.hidden && panel.dataset.verseRef === verseRef) {
                closeGemaraPanel();
                return;
            }
            try {
                const grouped = await getGemaraLinksForAliyah(aliyahRef);
                if (!state.gemaraEnabled || aliyahRef !== state.aliyotRefs[state.currentAliyahIndex]) return;
                applyGemaraAvailability(grouped);
                showGemaraPanel(trigger, verseRef, trigger.dataset.verseLabel || '', grouped[verseRef] || []);
            } catch (e) {
                console.error(e);
            }
        }

        function showGemaraPanel(trigger, verseRef, verseLabel, links) {
            const panel = document.getElementById('gemara-panel');
            renderGemaraPanelContent(verseRef, verseLabel, links);

            setActiveGemaraTrigger(trigger);
            panel.hidden = false;
            const mobile = isMobileGemaraLayout();
            panel.setAttribute('aria-modal', 'false');
            document.body.classList.add('gemara-panel-open');

            panel.style.top = '';
            panel.style.left = '';
            panel.style.height = mobile && gemaraDrawerHeight ? `${gemaraDrawerHeight}px` : '';
            if (mobile) document.body.style.setProperty('--gemara-drawer-height', `${gemaraDrawerHeight || 190}px`);
            if (!mobile && !isDesktopGemaraSidePanel()) {
                const anchorRect = trigger.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                let left = anchorRect.left - panelRect.width - 8;
                if (left < 12) left = anchorRect.right + 8;
                left = Math.max(12, Math.min(left, window.innerWidth - panelRect.width - 12));
                let top = anchorRect.bottom + 8;
                if (top + panelRect.height > window.innerHeight - 12) top = anchorRect.top - panelRect.height - 8;
                panel.style.left = `${left}px`;
                panel.style.top = `${Math.max(62, top)}px`;
            }
        }

        function renderGemaraPanelContent(verseRef, verseLabel, links) {
            const panel = document.getElementById('gemara-panel');
            panel.dataset.verseRef = verseRef;
            document.getElementById('gemara-panel-title').textContent = `מקורות בבבלי — ${verseLabel}`;
            document.getElementById('gemara-panel-content').innerHTML = links.length
                ? `<ul id="gemara-links">${links.map(link =>
                    `<li><a class="gemara-source-link" href="https://www.sefaria.org/${encodeURIComponent(link.ref)}" target="_blank" rel="noopener noreferrer">` +
                    `<span class="gemara-source-hebrew">${escapeHtml(link.heRef || link.tractateHe || link.ref)}</span></a></li>`
                ).join('')}</ul>`
                : `<p class="gemara-empty">לא נמצאו הפניות בתלמוד הבבלי לפסוק זה.</p>`;
        }

        function syncOpenGemaraPanelToVerse(verseNumber) {
            const panel = document.getElementById('gemara-panel');
            if (panel.hidden || (!isMobileGemaraLayout() && !isDesktopGemaraSidePanel()) ||
                !state.gemaraEnabled || !verseNumber?.dataset.verseRef) return;
            const verseRef = decodeURIComponent(verseNumber.dataset.verseRef);
            if (panel.dataset.verseRef === verseRef) return;
            const grouped = GemaraCache.get(state.aliyotRefs[state.currentAliyahIndex]);
            if (!grouped) return;
            renderGemaraPanelContent(verseRef, verseNumber.dataset.verseLabel || '', grouped[verseRef] || []);
            setActiveGemaraTrigger(Array.from(document.querySelectorAll('.gemara-trigger'))
                .find(trigger => trigger.dataset.verseRef === verseNumber.dataset.verseRef) || null);
        }

        function setActiveGemaraTrigger(trigger) {
            document.querySelectorAll('.gemara-trigger.gemara-open').forEach(openTrigger => {
                openTrigger.classList.remove('gemara-open');
                openTrigger.setAttribute('aria-expanded', 'false');
            });
            lastGemaraTrigger = trigger;
            if (trigger) {
                trigger.classList.add('gemara-open');
                trigger.setAttribute('aria-expanded', 'true');
            }
        }

        function startGemaraDrawerResize(e) {
            const panel = document.getElementById('gemara-panel');
            if (panel.hidden || !isMobileGemaraLayout()) return;
            e.currentTarget.setPointerCapture(e.pointerId);
            gemaraDrawerDrag = {
                pointerId: e.pointerId,
                startY: e.clientY,
                startHeight: panel.getBoundingClientRect().height
            };
        }

        function resizeGemaraDrawer(e) {
            if (!gemaraDrawerDrag || e.pointerId !== gemaraDrawerDrag.pointerId) return;
            e.preventDefault();
            const minHeight = 130;
            const maxHeight = window.innerHeight * 0.7;
            gemaraDrawerHeight = Math.max(minHeight, Math.min(maxHeight,
                gemaraDrawerDrag.startHeight + gemaraDrawerDrag.startY - e.clientY));
            document.getElementById('gemara-panel').style.height = `${gemaraDrawerHeight}px`;
            document.body.style.setProperty('--gemara-drawer-height', `${gemaraDrawerHeight}px`);
        }

        function stopGemaraDrawerResize(e) {
            if (!gemaraDrawerDrag || e.pointerId !== gemaraDrawerDrag.pointerId) return;
            gemaraDrawerDrag = null;
        }

        function constrainGemaraDrawer() {
            const panel = document.getElementById('gemara-panel');
            if (panel.hidden) return;
            if (!isMobileGemaraLayout()) {
                panel.style.height = '';
                return;
            }
            if (gemaraDrawerHeight) {
                gemaraDrawerHeight = Math.min(gemaraDrawerHeight, window.innerHeight * 0.7);
                panel.style.height = `${gemaraDrawerHeight}px`;
                document.body.style.setProperty('--gemara-drawer-height', `${gemaraDrawerHeight}px`);
            }
        }

        function closeGemaraPanel(restoreFocus = true) {
            const panel = document.getElementById('gemara-panel');
            if (!panel || panel.hidden) return;
            panel.hidden = true;
            document.body.classList.remove('gemara-panel-open');
            if (restoreFocus && lastGemaraTrigger?.isConnected) lastGemaraTrigger.focus();
            setActiveGemaraTrigger(null);
        }

        function isMobileGemaraLayout() {
            return window.matchMedia('(max-width: 700px)').matches;
        }

        function isDesktopGemaraSidePanel() {
            return window.matchMedia('(min-width: 980px)').matches;
        }

        window.toggleSettingsMenu = (e) => {
            e?.stopPropagation();
            const menu = document.getElementById('settings-menu');
            menu.hidden = !menu.hidden;
            document.getElementById('settings-button').setAttribute('aria-expanded', String(!menu.hidden));
        };

        function closeSettingsMenu() {
            document.getElementById('settings-menu').hidden = true;
            document.getElementById('settings-button').setAttribute('aria-expanded', 'false');
        }

        function applyGemaraPreference() {
            document.body.classList.toggle('gemara-enabled', state.gemaraEnabled);
            const toggle = document.getElementById('gemara-toggle');
            toggle.setAttribute('aria-pressed', String(state.gemaraEnabled));
            toggle.setAttribute('aria-label', state.gemaraEnabled ? 'הסתר קישורים לתלמוד הבבלי' : 'הצג קישורים לתלמוד הבבלי');
            document.getElementById('gemara-check').hidden = !state.gemaraEnabled;
            if (!state.gemaraEnabled) {
                closeGemaraPanel(false);
            }
        }

        window.toggleGemara = (e) => {
            e?.stopPropagation();
            state.gemaraEnabled = !state.gemaraEnabled;
            localStorage.setItem(GEMARA_ENABLED_KEY, String(state.gemaraEnabled));
            applyGemaraPreference();
            closeSettingsMenu();
            if (state.gemaraEnabled) {
                prepareGemaraForCurrentAliyah();
            }
        };

        function getCurrentVerseButton() {
            const buttons = document.querySelectorAll('.possuk-number');
            if (!buttons.length) return null;
            const readingLine = window.innerHeight * 0.3;
            let current = buttons[0];
            for (const button of buttons) {
                if (button.getBoundingClientRect().top > readingLine) break;
                current = button;
            }
            return current;
        }

        function getHNum(n) { return (n > 0 && n <= HEB_NUMBERS.length) ? HEB_NUMBERS[n - 1] : n; }

        function updateUI() {
            const idx = state.currentAliyahIndex;
            if (!state.aliyotRefs || state.aliyotRefs.length === 0) return;

            document.getElementById('aliyah-title').innerText = ALIYAH_NAMES[idx];

            const footerBtn = document.getElementById('footer-next-btn');
            footerBtn.innerText = (idx === state.aliyotRefs.length - 1) ? ("חזור ל" + ALIYAH_NAMES[0]) : ALIYAH_NAMES[idx + 1];
            document.getElementById('footer-nav').classList.remove('hidden');
            updateProgressEstimate();
        }

        function updateProgressEstimate() {
            const progress = document.getElementById('parsha-progress');
            if (!state.aliyotRefs.length) return;
            const counts = state.aliyotRefs.map(ref => state.verseCounts[ref]);
            if (counts.some(count => !Number.isFinite(count))) {
                progress.textContent = 'נותר בפרשה: מחשב...';
                return;
            }
            const position = state.readingPosition || {
                aliyahIndex: state.currentAliyahIndex,
                verseIndex: -1
            };
            const completed = counts.slice(0, position.aliyahIndex).reduce((sum, count) => sum + count, 0) + position.verseIndex + 1;
            const total = counts.reduce((sum, count) => sum + count, 0);
            const remaining = Math.max(0, Math.round(((total - completed) / total) * 100));
            progress.textContent = `נותר בפרשה: כ-${remaining}%`;
        }

        function scheduleReadingPositionUpdate() {
            clearTimeout(scrollUpdateTimer);
            scrollUpdateTimer = setTimeout(updateReadingPositionFromScroll, 180);
        }

        function updateReadingPositionFromScroll() {
            if (document.hidden) return;
            const current = getCurrentVerseButton();
            if (!current) return;

            state.readingPosition = {
                aliyahIndex: Number(current.dataset.aliyahIndex),
                verseIndex: Number(current.dataset.verseIndex)
            };
            syncOpenGemaraPanelToVerse(current);
            updateProgressEstimate();
        }

        window.handleFooterClick = (e) => {
            if (e && e.target) e.target.blur();
            let next = (state.currentAliyahIndex + 1) % state.aliyotRefs.length;
            state.bookmarkAutoFocus = false;
            loadAliyah(next);
        };

        window.changeAliyah = (dir, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            let next = (state.currentAliyahIndex + dir + state.aliyotRefs.length) % state.aliyotRefs.length;
            state.bookmarkAutoFocus = false;
            loadAliyah(next);
        };

        window.adjustFont = (d) => {
            state.fontSize = Math.max(16, Math.min(45, state.fontSize + d));
            document.getElementById('main-div').style.fontSize = state.fontSize + "px";
            scheduleSave();
        };
    </script>
</body>
